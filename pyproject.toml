[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sliderule-tool"
version = "0.1.0"
description = "A tool for accessing SlideRule Earth API data"
requires-python = ">=3.10"
dependencies = [
    "sliderule>=4.0",
    "geopandas>=0.14",
    "pyarrow>=14.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sliderule_tool*"]

[tool.ruff]
line-length = 100
target-version = "py311"
